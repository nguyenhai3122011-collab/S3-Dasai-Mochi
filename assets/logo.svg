<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dasai Mochi — mặt mặc định</title>
  <desc id="desc">Biểu cảm Chill Mochi trung tính với hai mắt trắng bo tròn và nụ cười nhẹ trên nền đen.</desc>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#000000"/>
  <g fill="#ffffff">
    <!-- Mắt capsule theo tỉ lệ khuôn mặt mặc định -->
    <rect x="74" y="175" width="116" height="137" rx="39"/>
    <rect x="322" y="175" width="116" height="137" rx="39"/>
  </g>
  <!-- Nụ cười nhẹ của biểu cảm Chill Mochi -->
  <path d="M226 333 Q256 355 286 333" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
</svg>
